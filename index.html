<script id="theme-system">
(function(){
 const system=window.matchMedia('(prefers-color-scheme: dark)');
 let mode='auto';
 try {const saved=localStorage.getItem('seerah-theme-mode');if(['auto','light','dark'].includes(saved)) mode=saved;} catch {}
 function apply(){
  const effective=mode==='auto'?(system.matches?'dark':'light'):mode;
  document.documentElement.dataset.theme=effective;
  document.documentElement.style.colorScheme=effective;
  const button=document.querySelector('.theme-toggle');
  const icon=document.getElementById('theme-icon');
  const next=mode==='auto'?'light':mode==='light'?'dark':'auto';
  if(icon){
    const icons={
      auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" opacity=".26"/><path d="M12 3.5v17" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
      light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 15.2A7.8 7.8 0 0 1 8.8 4.8 8.2 8.2 0 1 0 19.2 15.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>'
    };
    icon.innerHTML=icons[mode];
  }
  if(button){
   const label='Theme: '+mode+'. Switch to '+next;
   button.title=label;button.setAttribute('aria-label',label);
   button.dataset.mode=mode;
  }
 }
 window.toggleTheme=function(){
  mode=mode==='auto'?'light':mode==='light'?'dark':'auto';
  try {localStorage.setItem('seerah-theme-mode',mode);} catch {}
  apply();
 };
 if(system.addEventListener)system.addEventListener('change',apply);
 else system.addListener(apply);
 window.addEventListener('storage',event=>{
  if(event.key==='seerah-theme-mode'||event.key===null){mode=['light','dark'].includes(event.newValue)?event.newValue:'auto';apply();}
 });
 apply();document.addEventListener('DOMContentLoaded',apply);
})();
</script>

<style>
/* ── base ── */
:root{--green:#1B6B4A;--green-mid:#228B5E;--green-light:#2EAF77;--green-pale:#E8F5EE;--gold:#B8860B;--gold-light:#D4A017;--gold-pale:#FDF6E3}
[data-theme="light"]{--bg:#FAFAF8;--bg-2:#F3F3EE;--bg-3:#ECEEE8;--surface:#FFFFFF;--surface-2:#F7F7F4;--border:#E2E4DC;--text:#1A2318;--text-2:#4A5545;--text-3:#7A8875;--nav-bg:rgba(250,250,248,0.95);--shadow:0 2px 20px rgba(0,0,0,0.08);--shadow-lg:0 8px 40px rgba(0,0,0,0.12);--hero-gradient:linear-gradient(135deg,#E8F5EE 0%,#FAFAF8 50%,#FDF6E3 100%);--r-yr:rgba(27,107,74,.08)}
[data-theme="dark"]{--bg:#0D1710;--bg-2:#111D14;--bg-3:#162019;--surface:#1A2A1E;--surface-2:#1F3224;--border:#2A3D2E;--text:#EEF2EC;--text-2:#A8BBA4;--text-3:#6B8066;--nav-bg:rgba(13,23,16,0.95);--shadow:0 2px 20px rgba(0,0,0,0.3);--shadow-lg:0 8px 40px rgba(0,0,0,0.4);--hero-gradient:linear-gradient(135deg,#0D1710 0%,#111D14 50%,#0F1A10 100%);--r-yr:rgba(46,175,119,.13)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;overflow-x:hidden}
a{text-decoration:none}
.hi{font-family:"Tiro Devanagari Hindi",serif}
.ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl}
.progress-bar{position:fixed;top:64px;left:0;z-index:1100;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));width:0%;transition:width .1s linear;pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 1.5rem;gap:1rem;transition:background .3s,border-color .3s}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.seerah-nav-logo{width:46px;height:46px;object-fit:cover;border-radius:11px;display:block;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.logo-name{font-family:"Playfair Display",serif;font-size:17px;font-weight:700;color:var(--text)}
.logo-name span{color:var(--green-mid)}
.logo-tagline{font-size:9px;color:var(--text-3);letter-spacing:.5px;display:block;margin-top:-2px}
.nav-links{display:flex;align-items:center;list-style:none;margin-left:auto}
.nav-links>li{position:relative}
.nav-links>li>a{color:var(--text-2);font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:6px;transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.nav-links>li>a:hover{color:var(--green-mid);background:var(--green-pale)}
[data-theme="dark"] .nav-links>li>a:hover{background:rgba(46,175,119,.1)}
.has-dropdown>a::after{content:"▾";font-size:10px;margin-left:2px}
.dropdown{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;min-width:230px;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:100}

.question-ticker-arrow:focus-visible{outline:2px solid var(--green-mid);outline-offset:3px}
.question-ticker:hover{border-color:color-mix(in srgb,var(--green-mid) 38%,var(--border));box-shadow:0 10px 32px rgba(20,55,42,.09);transform:translateY(-1px)}
.question-ticker-arrow:hover{transform:translateX(2px);border-color:color-mix(in srgb,var(--green-mid) 38%,var(--border));background:color-mix(in srgb,var(--green-pale) 70%,var(--surface))}
[data-theme="dark"] .question-ticker{background:linear-gradient(135deg,color-mix(in srgb,var(--green-mid) 8%,var(--surface)) 0%,var(--surface) 60%,color-mix(in srgb,var(--gold-light) 5%,var(--surface)) 100%);box-shadow:0 10px 28px rgba(0,0,0,.14)}
.category-card-section{padding:12px 1.5rem;background:var(--bg);scroll-margin-top:78px}
.category-card-section.alt{background:var(--bg-2)}
.category-card-wrap{max-width:1100px;margin:0 auto}
.category-card{min-height:0;padding:22px 24px;display:grid;grid-template-columns:50px minmax(0,1fr);gap:18px;align-items:center}
.category-card .explore-icon{margin:0}

.category-card-kicker{display:block;margin-bottom:4px;color:var(--green-mid);font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.category-card h2{font-family:"Playfair Display",serif;font-size:clamp(20px,2.6vw,25px);line-height:1.25;color:var(--text);margin:0 0 5px}

@media (max-width:840px){
  .explore-card{min-height:0}
}
@media (max-width:520px){
  .explore-card{padding:21px}
  .question-ticker{margin-top:14px;border-radius:14px}
  .question-ticker-inner{grid-template-columns:minmax(0,1fr) 32px;gap:12px;padding:15px 14px 15px 18px}
  .question-ticker-arrow{width:31px;height:31px}
  .question-ticker-arrow svg{width:14px;height:14px}
  .popular-question-text{font-size:14px;line-height:1.48}
  .category-card-section{padding:8px 16px}
  .category-card{padding:18px;grid-template-columns:42px minmax(0,1fr);gap:14px}
  .category-card .explore-icon{width:42px;height:42px}
  .category-card p{font-size:13px}

@media (max-width:520px){
  .popular-question-text{min-height:2.96em}
}
@media (max-width:400px){

}
@media (prefers-reduced-motion:reduce){

/* ── base ── */
button:disabled{cursor:default}
.lang-chip{cursor:default}

/* ── header-hero-mobile ── */
@media (max-width: 840px){

  .shero-inner > div{min-width: 0;}

/* ── contribute-section-style ── */
.contribute-section{max-width:1100px;margin:0 auto 56px;padding:0 24px;scroll-margin-top:84px}
.contribute-panel{padding:44px;border:1px solid var(--border);border-radius:24px;background:var(--surface);position:relative;overflow:hidden}
.contribute-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1b6b4a,#c49a3c)}
.contribute-heading{max-width:620px;margin-bottom:28px}
.contribute-kicker{display:block;color:var(--green-mid);font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
.contribute-heading h2{font-family:"Playfair Display",serif;font-size:clamp(27px,3.5vw,38px);line-height:1.2;color:var(--text);margin:0 0 14px}
.contribute-heading p{font-size:15px;line-height:1.75;color:var(--text-2);margin:0}
.contribute-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.contribute-card{min-width:0;border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--bg-2)}
.contribute-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;color:var(--green-mid);background:var(--surface);margin-bottom:18px}
.contribute-icon svg{width:23px;height:23px}
.contribute-card h3{font-size:17px;line-height:1.4;color:var(--text);margin:0 0 9px}
.contribute-card p{font-size:14px;line-height:1.7;color:var(--text-2);margin:0}
.contribute-action{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}
.contribute-action p{font-size:13px;line-height:1.6;color:var(--text-3);max-width:340px;margin:0}
.contribute-link{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:48px;padding:13px 22px;border:1px solid #1b6b4a;border-radius:10px;background:#1b6b4a;color:#fff;text-decoration:none;font-size:14px;font-weight:700;line-height:1.5;text-align:center}
.contribute-link:hover{background:#124c34;border-color:#124c34}
.contribute-link:focus-visible{outline:3px solid #c49a3c;outline-offset:4px}
.contribute-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:700px){
  .contribute-section{padding:0 16px;margin-bottom:32px}
  .contribute-panel{padding:26px 20px;border-radius:18px}
  .contribute-grid{grid-template-columns:1fr;gap:12px}
  .contribute-card{padding:20px}
  .contribute-action{flex-direction:column;align-items:stretch;gap:16px;margin-top:22px}
  .contribute-link{width:100%;box-sizing:border-box}
}

/* ── contributor-login-style ── */
.contributor-login{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-height:42px;padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;line-height:1.4;text-decoration:none;white-space:nowrap}
.contributor-login:hover{border-color:var(--green-mid);color:var(--green-mid)}
.contributor-login:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.contributor-login-mobile{display:none}
@media (max-width:840px){
  .contributor-login-desktop{display:none}
  .contributor-login-mobile{display:inline}
}

/* ── hero-color-brand-update ── */
[data-theme="light"] .shero{--gold:#8A6508;--gold-light:#8A6508}
[data-theme="dark"] .shero h1 em{color:#54C994}
.brand-salawat{display:none;font-family:"Amiri",serif;font-weight:400;letter-spacing:0;line-height:1.4}

/* ── hero-ayah-rotation ── */
.hero-ayah-rotator{display:grid;margin-bottom:1.3rem}
.hero-ayah-slide{grid-area:1/1;align-self:center;opacity:0;visibility:hidden;transform:translateY(5px);transition:opacity .6s ease,transform .6s ease}
.hero-ayah-slide.is-active{opacity:1;visibility:visible;transform:translateY(0)}
.hero-ayah-rotator .shero-arabic{margin-bottom:.25rem}
.shero-translation{max-width:52ch;margin:.55rem auto .45rem;color:var(--text-2);font-family:"Spectral",serif;font-size:14px;line-height:1.55;text-align:center}
.hero-ayah-rotator .shero-ayah-ref{margin-bottom:0}
@media (max-width:480px){
  .shero-translation{font-size:13px;line-height:1.55}
}
@media (prefers-reduced-motion:reduce){
  .hero-ayah-slide{transform:none;transition:none}
}

/* ── hadith-rotation-style ── */
.hadith-reminder{position:relative;
  isolation:isolate;
  overflow:hidden;
  max-width:760px;
  min-height:118px;
  margin:-58px auto 30px;
  padding:20px 28px 18px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border:1px solid color-mix(in srgb,var(--green-mid) 22%,var(--border));
  border-radius:20px;
  background:
    radial-gradient(circle at 8% 18%,rgba(46,175,119,.12),transparent 34%),
    radial-gradient(circle at 92% 82%,rgba(176,130,24,.10),transparent 32%),
    linear-gradient(135deg,color-mix(in srgb,var(--surface) 96%,var(--green-pale)),var(--surface));
  box-shadow:0 18px 45px rgba(19,73,50,.10),0 3px 10px rgba(0,0,0,.035);}
.hadith-reminder::before{content:"";
  position:absolute;
  z-index:-1;
  inset:0 18%;
  border-top:1px solid rgba(176,130,24,.22);
  opacity:.7;}
[data-theme="dark"] .hadith-reminder{border-color:rgba(84,201,148,.18);
  background:
    radial-gradient(circle at 8% 18%,rgba(84,201,148,.11),transparent 34%),
    radial-gradient(circle at 92% 82%,rgba(205,165,69,.09),transparent 32%),
    var(--surface);
  box-shadow:0 18px 45px rgba(0,0,0,.22);}
.hadith-kicker{display:block;
  margin-bottom:9px;
  color:var(--green-mid);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;}
.hadith-quote{max-width:680px;
  width:100%;
  height:calc(1.5em * 3);
  margin:0 auto;
  padding:0;
  color:var(--text);
  font-family:"Spectral",serif;
  font-size:clamp(16px,1.8vw,19px);
  line-height:1.5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  text-wrap:balance;
  opacity:1;
  transform:translateY(0);
  transition:opacity .38s ease,transform .38s ease;}
.hadith-source{margin-top:9px;
  color:var(--gold);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.25px;
  text-transform:uppercase;
  opacity:1;
  transition:opacity .38s ease;}
@media (max-width:900px){
  .hadith-reminder{margin:-30px auto 26px}
}
@media (max-width:700px){
  .hadith-reminder{min-height:132px;margin:0 auto 22px;padding:15px 14px 13px;border-radius:17px}
  .hadith-quote{height:calc(1.48em * 3);font-size:15.5px;line-height:1.48}
  .hadith-source{font-size:9.5px;margin-top:7px}
}
@media (prefers-reduced-motion:reduce){
  .hadith-quote,.hadith-source{transition:none}
}

/* ── timeline-lineage-layout ── */
.timeline-lineage-section{padding:14px 1.5rem 20px;background:var(--bg);scroll-margin-top:78px}
.timeline-lineage-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,.9fr);gap:14px;align-items:stretch}
.timeline-panel,.lineage-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(20,55,42,.04)}
.timeline-panel::after,.lineage-panel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--green),var(--gold-light));opacity:.7}
.timeline-panel{padding:19px 20px 17px}
.timeline-panel-head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:center}
.timeline-panel .explore-icon{margin:0;width:42px;height:42px}
.timeline-panel .category-card-kicker,.lineage-kicker{display:block;margin-bottom:3px;color:var(--green-mid);font-size:8.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.timeline-panel h2,.lineage-panel h3{font-family:"Playfair Display",serif;color:var(--text);margin:0}
.timeline-panel h2{font-size:clamp(21px,2.4vw,26px);line-height:1.18;margin-bottom:4px}
.timeline-panel-head p{font-size:12.8px;line-height:1.5;color:var(--text-2);margin:0;max-width:620px}
.timeline-preview{margin-top:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-left:56px}
.timeline-stop{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid color-mix(in srgb,var(--border) 84%,transparent);border-radius:999px;background:color-mix(in srgb,var(--surface) 93%,var(--green-pale));white-space:nowrap}
.timeline-stop::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green-mid);flex:0 0 auto}
.timeline-stop strong{font-size:10.5px;line-height:1.2;color:var(--text);font-weight:700}
.timeline-stop span{display:none}
.lineage-panel{padding:17px 18px 15px;background:linear-gradient(145deg,color-mix(in srgb,var(--green-pale) 50%,var(--surface)) 0%,var(--surface) 70%)}
[data-theme="dark"] .lineage-panel{background:linear-gradient(145deg,color-mix(in srgb,var(--green-mid) 7%,var(--surface)) 0%,var(--surface) 72%)}
.lineage-panel-head{padding-bottom:9px;border-bottom:1px solid color-mix(in srgb,var(--border) 82%,transparent)}
.lineage-panel h3{font-size:19px;line-height:1.15;margin-bottom:2px}
.lineage-subtitle{font-size:10.5px;color:var(--text-3);line-height:1.35}
.lineage-tree{padding:11px 0 0}
.lineage-row{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:nowrap;white-space:nowrap;font-size:10.5px;line-height:1.3;color:var(--text-2)}
.lineage-name{font-weight:650;color:var(--text-2)}
.lineage-name.prophet{font-family:"Libre Baskerville","Georgia",serif;font-weight:700;color:var(--text);padding:4px 7px;border-radius:8px;background:color-mix(in srgb,var(--green-pale) 62%,var(--surface));border:1px solid color-mix(in srgb,var(--green-mid) 16%,var(--border))}
[data-theme="dark"] .lineage-name.prophet{background:color-mix(in srgb,var(--green-mid) 10%,var(--surface))}
.lineage-arrow{color:var(--green-mid);font-size:10px;opacity:.8}
@media (max-width:820px){
  .timeline-lineage-wrap{grid-template-columns:1fr}
  .timeline-lineage-section{padding-top:12px}
  .timeline-preview{padding-left:56px}
  .lineage-panel{padding-top:16px}
}
@media (max-width:560px){
  .timeline-lineage-section{padding:8px 16px 16px}
  .timeline-lineage-wrap{gap:10px}
  .timeline-panel{padding:16px}
  .timeline-panel-head{grid-template-columns:38px minmax(0,1fr);gap:12px}
  .timeline-panel .explore-icon{width:30px;height:30px}
  .timeline-panel h2{font-size:21px}
  .timeline-panel-head p{font-size:12.5px}
  .timeline-preview{padding-left:0;margin-top:12px;gap:6px}
  .timeline-stop{padding:5px 8px}
  .lineage-panel{padding:15px}
  .lineage-panel h3{font-size:18px}
  .lineage-row{gap:4px}
}
